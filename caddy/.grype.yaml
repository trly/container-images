ignore:
  # go-jose: JWE DoS — not affected; no JWT/JWE handling in our Caddyfiles
  - vulnerability: CVE-2026-34986
    include-aliases: true
    reason: No JWT/JWE handling in our Caddyfiles.

  # smallstep/certificates: SCEP unauthenticated issuance — no acme_server directive used
  - vulnerability: CVE-2026-30836
    include-aliases: true
    reason: No acme_server directive used.

  # otel/sdk: PATH hijack on BSD kenv — no tracing/otel configured, and we run on Linux
  - vulnerability: CVE-2026-39883
    include-aliases: true
    reason: No tracing/otel configured; runs on Linux.

  # grpc authz bypass — no gRPC or authorization policies configured
  - vulnerability: CVE-2026-33186
    include-aliases: true
    reason: No gRPC or authorization policies configured.
